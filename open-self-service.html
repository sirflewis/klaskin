<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Self Service+…</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:#F5F5F7; font-family:"Open Sans",Calibri,system-ui,sans-serif; }
  .box { background:#FFFFFF; border:1px solid #DEDEE2; padding:40px 36px; text-align:center; max-width:360px; }
  h1 { font-size:18px; color:#0C0C12; margin:0 0 10px; }
  p { font-size:14px; color:#5A5A64; margin:0 0 22px; line-height:1.5; }
  a.btn { display:inline-block; background-color:#41007F; color:#FFFFFF !important; text-decoration:none;
          font-weight:700; font-size:14px; padding:14px 30px; }
</style>
<script>
  // Attempt the automatic hand-off to Self Service+. Many browsers require a user
  // gesture for custom-scheme launches, so this is a bonus, not the only path.
  window.location.href = "jamfselfservice://";
</script>
</head>
<body>
  <div class="box">
    <h1>Opening Self Service+…</h1>
    <p>This should open automatically on your Mac. If nothing happens, click below.</p>
    <a class="btn" href="jamfselfservice://">Open Self Service+</a>
  </div>
</body>
</html>
